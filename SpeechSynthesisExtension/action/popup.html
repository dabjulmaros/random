<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speak Now</title>
  <!-- Or Forever hold your peace -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=graphic_eq,pause,play_arrow,stop,volume_down,volume_mute,volume_up" />
</head>
<!-- utterance max length is 32,767 chars -->
<!-- voices
 pause
 resume
 cancel
 pitch 0-1-2
 rate 0.1-1-10
 volume 0-1

  -->

<body>
  <button id="popout" title="Pop Out To a New Window">🪟</button>
  <div id="controls">
    <select></select>
    <span>
      <!-- ▶ ⏸ ▶️ ⏸️  -->
      <button id="play-pause"> <span class="material-symbols-outlined">
          play_arrow
        </span></button>
      <!-- ⏹ ⏹️ -->
      <button id="stop"> <span class="material-symbols-outlined">
          stop
        </span></button>
      <!-- 🔇🔈🔉🔊 -->
      <span class="controlHolder">
        <span id="showVolume" class="control"><span class="material-symbols-outlined">volume_up</span></span>
        <span id="volume">100%</span>
        <input type="range" name="volume" id="volume" min="0" max="1" step=".1"></span>
    </span>
    <span>
      <span class="controlHolder">
        <span id="showPitch" class="control">
          <span class="material-symbols-outlined">
            graphic_eq
          </span>
        </span>
        <input type="range" name="pitch" id="pitch" min="0" max="2" step=".1">
      </span>
      <span class="controlHolder">
        <span id="showRate">1</span>
        <select name="rate" id="rate"></select>
        <input type="range" name="rate+" id="rate+" min="0.1" max="10" step=".1">
      </span>
    </span>
  </div>
  <div id="toast">Copied!</div>
</body>
<script src="script.js"></script>

</html>
