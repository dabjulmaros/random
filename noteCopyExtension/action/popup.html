<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copy Reply Quick</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <button id="popout" class="icon-btn" title="Pop Out To a New Window">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M19 19H5V5h7V3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
    </svg>
  </button>
  <div id='wrapper'>
  </div>
  <div id="createNote">
    <button id="createNoteBtn" class="icon-btn" title="Create Note">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-9H6V4h5v5h2V5z"/>
      </svg>
    </button>
  </div>
  <dialog id="dialog">

    <label>
      <h3>Title:</h3>
      <input type="text" id="newTitle" />
    </label>

    <label>
      <h3>Content:</h3>
      <textarea id="newNote"></textarea>
    </label>
      <div>
        <button id="cancelButton" class="icon-btn" title="Cancel">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>
        <button id="submitButton" class="icon-btn" title="Add">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>
          </svg>
        </button>
      </div>
  </dialog>
  <div id="toast" role="alert" aria-live="polite">Copied!</div>
  <script src="script.js"></script>
</body>

</html>
